name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the engine AAR
        env:
          ENGINE_AAR_URL: ${{ secrets.ENGINE_AAR_URL }}
        run: |
          test -n "$ENGINE_AAR_URL" || { echo "ENGINE_AAR_URL secret is required to publish" >&2; exit 1; }
          mkdir -p libs
          curl -fsSL "$ENGINE_AAR_URL" -o libs/facerecognitionsdk.aar

      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishReleasePublicationToCentralRepository --no-daemon
