plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

ext {
    publishArtifactId = 'face-recognition-capture'
    publishDescription = 'FacePlugin capture coach for Android: oval guide, live quality and pose coaching, ' +
        'hold-to-capture, and a full attribute check of the captured still.'
}

android {
    namespace 'com.faceplugin.facerecognitionsdk.capture'
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':face-recognition-kit')
    compileOnly files(rootProject.file('libs/facerecognitionsdk.aar'))
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
}

// Maven Central requires a javadoc jar for every artifact.
apply plugin: 'org.jetbrains.dokka'

tasks.register('javadocJar', Jar) {
    archiveClassifier.set('javadoc')
    from tasks.named('dokkaJavadoc')
}

apply from: "$rootDir/gradle/publish.gradle"
